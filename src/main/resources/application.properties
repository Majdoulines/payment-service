spring.application.name=payment-service
server.port=8083


spring.profiles.active=standalone

spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ===== Eureka (utilise seulement en mode microservices) =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# ===== JWT (meme cle que user-service) =====
jwt.secret=pH36DgwVLSfGb7PNu9CYRyZSQxllE2BUuthvtSCg5oQ=
jwt.expiration-ms=86400000

# ===== Regles metier de la SFD =====
payment.commission-rate=0.05
payment.commission-minimum=0.40
payment.max-amount=5000
payment.release-after-delivery=5d
payment.release-after-shipping=15d
payment.pending-expiration=30m
payment.min-payout=1.00
payment.jobs.enabled=true